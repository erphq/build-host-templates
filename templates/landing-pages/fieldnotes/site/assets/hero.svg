<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="1600" height="1000" fill="#e7a287"/><text x="80" y="87" font-size="38" font-family="Arial" fill="#292c28" font-weight="700" letter-spacing="-1.5">fieldnotes</text><text x="800" y="242" font-size="88" font-family="Arial" fill="#292c28" font-weight="700" letter-spacing="-5" text-anchor="middle">Keep the voice.</text><path d="M407 343L1217 321L1220 365L410 386Z" fill="#f5d97b"/><text x="800" y="348" font-size="88" font-family="Arial" fill="#292c28" font-weight="700" letter-spacing="-5" text-anchor="middle">Find the meaning.</text><text x="800" y="414" font-size="23" font-family="Arial" fill="#4e443c" text-anchor="middle">Interviews, highlights, and interpretations. Connected to the source.</text><rect x="90" y="480" width="1420" height="465" rx="14" fill="#fff" stroke="#9b9c88"/><path d="M90 536H1510M330 536V945M1025 536V945" stroke="#d9ded0"/><text x="115" y="515" font-size="16" font-family="Arial" fill="#687057" >FIELDNOTES / EXAMPLE WORKSPACE</text><rect x="91" y="537" width="238" height="407" fill="#f4f4ec"/><text x="117" y="582" font-size="22" font-family="Arial" fill="#303c27" font-weight="600">First impressions</text><rect x="110" y="619" width="196" height="46" rx="5" fill="#dfe6d4"/><text x="126" y="650" font-size="18" font-family="Arial" fill="#303c27" >Interviews</text><text x="126" y="704" font-size="18" font-family="Arial" fill="#647254" >Highlights</text><text x="126" y="758" font-size="18" font-family="Arial" fill="#647254" >Insights</text><text x="362" y="586" font-size="16" font-family="Arial" fill="#647254" >PARTICIPANT 01 / 06:32</text><text x="362" y="631" font-size="31" font-family="Arial" fill="#303c27" font-weight="600">Finding the first useful step</text><rect x="358" y="671" width="585" height="39" fill="#f5dc8d"/><text x="367" y="700" font-size="24" font-family="Arial" fill="#35422c" >The example project helped more</text><text x="367" y="741" font-size="24" font-family="Arial" fill="#35422c" >than the checklist. I could see what a</text><text x="367" y="782" font-size="24" font-family="Arial" fill="#35422c" >finished version looked like, and then</text><text x="367" y="823" font-size="24" font-family="Arial" fill="#35422c" >the labels started to make sense.</text><rect x="364" y="863" width="88" height="34" rx="4" fill="#f1d77f"/><text x="380" y="887" font-size="16" font-family="Arial" fill="#39452f" >Clarity</text><text x="1060" y="587" font-size="15" font-family="Arial" fill="#647254" >EXAMPLE INTERPRETATION</text><text x="1060" y="644" font-size="27" font-family="Arial" fill="#303c27" font-weight="600">Show the destination</text><text x="1060" y="682" font-size="27" font-family="Arial" fill="#303c27" font-weight="600">before the directions.</text><text x="1060" y="743" font-size="20" font-family="Arial" fill="#59624e" >A concrete example may help</text><text x="1060" y="777" font-size="20" font-family="Arial" fill="#59624e" >a new user understand what</text><text x="1060" y="811" font-size="20" font-family="Arial" fill="#59624e" >the workspace is for.</text><path d="M1060 850H1470" stroke="#c4ceb7"/><text x="1060" y="887" font-size="17" font-family="Arial" fill="#4c6439" >Connected to source passage ↗</text></svg>