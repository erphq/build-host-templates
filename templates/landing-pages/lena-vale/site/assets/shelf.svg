<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#e6e9d5"/><g fill="#30372f" font-family="Arial,sans-serif"><rect x="220" y="110" width="760" height="680" rx="8" fill="#fbfcf7"/><text x="265" y="180" font-size="30">Shelf</text><text x="265" y="238" font-size="18" fill="#68715e">A SMALL READING COLLECTION</text><line x1="265" y1="290" x2="935" y2="290" stroke="#dce1d5"/><text x="265" y="337" font-size="25">The useful city</text><text x="265" y="375" font-size="18" fill="#68715e">A way to explain public space.</text><line x1="265" y1="435" x2="935" y2="435" stroke="#dce1d5"/><text x="265" y="482" font-size="25">Letters from the coast</text><text x="265" y="520" font-size="18" fill="#68715e">Read again before the next trip.</text><line x1="265" y1="580" x2="935" y2="580" stroke="#dce1d5"/><text x="265" y="627" font-size="25">A room for listening</text><text x="265" y="665" font-size="18" fill="#68715e">Keep the idea of a quiet entrance.</text></g></svg>