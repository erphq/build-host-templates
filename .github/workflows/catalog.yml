name: Template collection
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --check
      - run: python -m unittest discover -s tests
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-template-preview
          path: dist
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-template-preview
          path: dist
      - name: Package the reviewed catalog
        run: |
          tar -czf catalog.tar.gz -C dist .
          sha256sum catalog.tar.gz > catalog.tar.gz.sha256
      - name: Publish immutable catalog release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: catalog-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" catalog.tar.gz catalog.tar.gz.sha256 --title "Template collection ${RELEASE_TAG#catalog-}" --notes "Reviewed catalog built from the main branch. build.host imports this release automatically." --latest
